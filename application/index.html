<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0B0B0C" />
  <meta name="application-name" content="CedPlay" />
  <title>CedPlay — Direct, films et séries</title>
  <meta name="description" content="CedPlay : tes chaînes en direct, films et séries, mosaïque, guide des programmes et enregistrements." />

  <meta property="og:title" content="CedPlay — Direct, films et séries" />
  <meta property="og:description" content="Tes chaînes en direct, films et séries, mosaïque et guide des programmes." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CedPlay" />
  <meta property="og:image" content="/cedplay-social.png" />
  <meta property="og:image:alt" content="CedPlay — Direct, films et séries" />

  <script>
    // Applique le thème avant le premier rendu (évite le flash clair/sombre).
    // `iptv_theme` est le miroir écrit par l'app à chaque changement ; `iptv_settings`
    // reste lu en repli pour les installations issues d'une ancienne version.
    try {
      var theme = localStorage.getItem('iptv_theme');
      if (theme !== 'light' && theme !== 'dark') {
        var s = JSON.parse(localStorage.getItem('iptv_settings') || '{}');
        theme = s.theme;
      }
      if (theme !== 'light') document.documentElement.classList.add('dark');
    } catch (e) { document.documentElement.classList.add('dark'); }
  </script>


  <!-- Content-Security-Policy : barrière partielle, pas une garantie. Réductions réelles :
       aucun plugin (object-src), base-uri verrouillée, pas de frame distante. En revanche
       'unsafe-inline' (script de thème ci-dessus) et 'unsafe-eval' (vieux webviews) autorisent
       encore l'exécution de scripts non fournis par le bundle, et connexion/médias restent
       ouvertes (flux IPTV http/https, relais web, TMDB, sous-titres). Le lecteur natif et
       CapacitorHttp ne passent pas par le webview et restent soumis aux seules permissions Android. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' data:; connect-src 'self' http: https: ws: wss: data: blob:; media-src 'self' blob: data: https: http:; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'" />

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
