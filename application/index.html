  <script>
    // Applique le thème avant le premier rendu (évite le flash clair/sombre).
    try {
      var s = JSON.parse(localStorage.getItem('iptv_settings') || '{}');
      if (s.theme !== 'light') document.documentElement.classList.add('dark');
    } catch (e) { document.documentElement.classList.add('dark'); }
  </script>
