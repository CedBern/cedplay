apply plugin: 'com.android.application'

// Signature release. Décision documentée (audit 2026-11-07, item 16) : l'APK personnel
// reste signé avec le certificat de débogage (~/.android/debug.keystore) pour que chaque
// version s'installe par-dessus la précédente sans réinstaller ni perdre les données.
// SAUVEGARDE : si ce keystore debug est perdu, plus aucune mise à jour n'est possible
// sans désinstallation — en garder une copie en lieu sûr.
// Pour passer à un keystore dédié plus tard : créer android/keystore.properties (hors git) :
//   storeFile=<chemin du .keystore, relatif à android/>
//   storePassword=…  keyAlias=…  keyPassword=…
// et la configuration ci-dessous bascule automatiquement (aucune modification du fichier).
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
def hasReleaseKeystore = keystorePropsFile.exists()
if (hasReleaseKeystore) keystorePropsFile.withInputStream { keystoreProps.load(it) }

android {
    namespace "com.lecteur.iptv"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lecteur.iptv"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 44
        versionName "1.11.15"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // APK personnel : même certificat de débogage pour mettre à jour sans réinstaller,
            // minification R8 pour un APK plus léger et plus rapide à démarrer.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
    implementation 'androidx.media3:media3-session:1.2.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.tvprovider:tvprovider:1.0.0'
    implementation 'com.google.android.gms:play-services-cast-framework:21.4.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
